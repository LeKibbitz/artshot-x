[package]
name = "artshot-platform"
version = "0.1.0"
edition = "2021"

[dependencies]
xcap = "0.9.8"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.26"
hound = "3.5"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Performance", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
