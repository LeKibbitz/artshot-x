name: Desktop preview installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-preview.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: artshot-x-preview-macos-arm64
            extension: dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: artshot-x-preview-windows-x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Prepare native resources
        working-directory: desktop
        run: npm run prepare:native
      - name: Test frontend helpers
        working-directory: desktop
        run: npm test
      - name: Test Rust workspace
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Build installer
        working-directory: desktop
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.${{ matrix.extension }}
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          name: ArtShot X Preview ${{ github.ref_name }}
          files: |
            installers/**/*.dmg
            installers/**/*.exe
